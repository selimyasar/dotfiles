# starship-minimal.toml
# Düşük renk desteği (256/basic) veya bilinmeyen terminal — ikon yok.
# ANSI isimli renkler kullanılır, böylece light/dark palete uyum sağlar.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 500

format = '$directory$git_branch$git_status$character'

[character]
success_symbol = '[>](bold green)'
error_symbol   = '[>](bold red)'

[directory]
style             = 'bold cyan'
truncation_length = 2
truncate_to_repo  = true
format            = '[$path]($style) '

[git_branch]
symbol = ''
style  = 'purple'
format = '[$branch]($style) '

[git_status]
style    = 'red'
format   = '([$all_status$ahead_behind]($style) )'
modified = '*'
staged   = '+'
untracked = '?'

[python]
disabled = true
[nodejs]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[os]
disabled = true
[cmd_duration]
disabled = true
