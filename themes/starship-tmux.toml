# starship-tmux.toml
# Tmux içi — dar panel, kısa prompt, Nerd Font var

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 600

# Tek satır, kompakt
format = '$directory$git_branch$git_status$character'

[character]
success_symbol = '[❯](bold #9ece6a)'
error_symbol   = '[❯](bold #f7768e)'

[directory]
style             = 'bold #7aa2f7'
truncation_length = 2
truncate_to_repo  = true
format            = '[$path]($style) '
read_only         = '󰌾 '

[git_branch]
symbol = ' '
style  = '#bb9af7'
format = '[$symbol$branch]($style) '

[git_status]
style  = '#f7768e'
format = '([$all_status$ahead_behind]($style) )'
ahead    = '⇡'
behind   = '⇣'
modified = '!'
staged   = '+'
untracked = '?'

[python]
disabled = true
[nodejs]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[os]
disabled = true
[cmd_duration]
disabled = true
