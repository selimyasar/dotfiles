# starship-full-light.toml
# Lokal terminal, truecolor, Nerd Font mevcut — AYDINLIK mod (Tokyonight Day)

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 800

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$node\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ── Karakter ──────────────────────────────────
[character]
success_symbol = '[❯](bold #587539)'
error_symbol   = '[❯](bold #f52a65)'
vimcmd_symbol  = '[❮](bold #9854f1)'

# ── Dizin ─────────────────────────────────────
[directory]
style            = 'bold #2e7de9'
truncation_length = 3
truncate_to_repo  = true
format           = '[$path]($style)[$read_only]($read_only_style) '
read_only        = ' 󰌾'

# ── Git ───────────────────────────────────────
[git_branch]
symbol = ' '
style  = '#9854f1'
format = 'on [$symbol$branch(:$remote_branch)]($style) '

[git_status]
style     = '#f52a65'
format    = '([$all_status$ahead_behind]($style) )'
conflicted  = '󰩤 '
ahead       = '⇡${count} '
behind      = '⇣${count} '
diverged    = '⇕ '
untracked   = '? '
stashed     = ' '
modified    = '! '
staged      = '+ '
renamed     = '» '
deleted     = '✘ '

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style  = '#8c6c3e'

# ── Diller ────────────────────────────────────
[python]
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style  = '#8c6c3e'

[nodejs]
symbol = ' '
format = '[$symbol($version )]($style)'
style  = '#587539'

[rust]
symbol = '󱘗 '
format = '[$symbol($version )]($style)'
style  = '#f52a65'

[golang]
symbol = ' '
format = '[$symbol($version )]($style)'
style  = '#007197'

# ── Sistem ────────────────────────────────────
[os]
disabled = false
format   = '[$symbol]($style) '
style    = '#6172b0'

[os.symbols]
Macos  = ''
Ubuntu = ''
Debian = ''
Fedora = ''
Arch   = ''
Alpine = ''

[username]
show_always = false
style_user  = '#2e7de9'
style_root  = 'bold #f52a65'
format      = '[$user]($style) in '

[docker_context]
symbol = ' '
format = '[$symbol$context]($style) '
style  = '#007197'
only_with_files = true

# ── Süre ──────────────────────────────────────
[cmd_duration]
min_time = 2000
format   = '[$duration]($style) '
style    = '#6172b0'
